services:
  bot:
    build: .
    command: python -m app.bot.main
    env_file: .env
    restart: unless-stopped

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"   # наружу через nginx/caddy с HTTPS
    restart: unless-stopped

  worker:
    build: .
    command: python -m app.worker.main
    env_file: .env
    restart: unless-stopped
